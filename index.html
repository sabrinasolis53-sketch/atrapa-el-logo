<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#30355e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<title>Atrapá el Logo Clusterciar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: panel de marca + marcador a la izquierda, campo de juego a la derecha (vertical: apilado) */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --ink:#30355e; --muted:#5d6382;
  --accent:#0074a2; --signal:#00b8b8; --line:#d6dde8; --brand:#30355e;
  color-scheme:light;
  --font-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  padding-block:clamp(10px,2.4vh,40px);
  padding-left:max(clamp(16px,2.5vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.5vw,56px),env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,22px)}
header{position:relative;flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:clamp(14px,2.2vh,32px) clamp(16px,2.5vw,36px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1vh,14px)}
.logo{height:clamp(64px,8vh,120px);width:auto;max-width:100%;display:block}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:clamp(11px,1.5vh,16px);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4vh,54px);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--signal)}
.lead{margin:0;color:var(--muted);font-size:clamp(14px,1.8vh,21px);max-width:44ch;line-height:1.45}
.lead b{color:var(--ink)}
.fs{position:absolute;top:clamp(10px,1.6vh,18px);right:clamp(10px,1.6vw,18px);border:0;border-radius:10px;
  background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);font:700 clamp(11px,1.3vh,14px) var(--font-display);padding:8px 12px;cursor:pointer}
.fs[hidden]{display:none}

.bar{flex:0 0 auto;display:flex;gap:clamp(8px,1.4vw,16px)}
.stat{flex:1 1 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(8px,1.3vh,16px) clamp(10px,1.6vw,20px);display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3.8vh,52px);line-height:1.05;font-variant-numeric:tabular-nums}
.stat small{font-size:clamp(10px,1.3vh,15px);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#scoreBox b{color:var(--accent)}
#timeBox.low{border-color:var(--signal)} #timeBox.low b{color:var(--signal)}
.legend{flex:0 0 auto;display:flex;justify-content:center;gap:clamp(12px,2vw,28px);flex-wrap:wrap;font-family:var(--font-display);font-weight:700;font-size:clamp(13px,1.8vh,20px);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend img{height:clamp(22px,3.2vh,40px);width:auto}
.legend em{font-style:normal;color:var(--accent)}
.legend .gold em{color:var(--signal)}

.field{position:relative;flex:1 1 auto;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  background-image:radial-gradient(color-mix(in srgb,var(--accent) 10%,transparent) 1.5px,transparent 1.5px);background-size:28px 28px}
.target{position:absolute;border:0;padding:0;background:var(--surface);border-radius:50%;cursor:pointer;
  box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 18%,transparent),0 0 0 2px var(--line);
  display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%) scale(0);animation:popIn .18s ease-out forwards}
.target img{width:64%;height:64%;object-fit:contain;pointer-events:none}
.target.gold{box-shadow:0 0 0 5px var(--signal),0 8px 26px color-mix(in srgb,var(--signal) 45%,transparent)}
.target.hit{animation:hitOut .22s ease-in forwards}
.target.gone{animation:fadeOut .16s ease-in forwards}
@keyframes popIn{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes hitOut{to{transform:translate(-50%,-50%) scale(1.35);opacity:0}}
@keyframes fadeOut{to{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.plus{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.4vh,60px);color:var(--accent);pointer-events:none;animation:rise .7s ease-out forwards}
.plus.gold{color:var(--signal)}
@keyframes rise{to{transform:translate(-50%,-140%);opacity:0}}

.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2vh,26px);text-align:center;padding:20px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay[hidden]{display:none}
.overlay h2{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vh,66px);margin:0;line-height:1.05;text-wrap:balance}
.overlay h2.rec{color:var(--signal)}
.goal{font-style:normal;font-size:.5em;color:var(--muted);margin-left:2px}
#scoreBox.met{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 12%,var(--surface))}
#scoreBox.met small{color:var(--signal);font-weight:700}
.overlay.won{background:color-mix(in srgb,var(--signal) 22%,var(--surface))}
.overlay.won h2{color:var(--signal);font-size:clamp(48px,11vh,150px);letter-spacing:-.02em}
.overlay.lost h2{color:var(--accent);font-size:clamp(40px,8vh,110px)}
.overlay p{margin:0;color:var(--muted);font-weight:600;font-size:clamp(15px,2.3vh,28px);max-width:34ch}
.overlay p b{color:var(--ink)}
.big{font-family:var(--font-display);font-weight:800;font-size:clamp(70px,16vh,200px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.big.pop{animation:cd .8s ease-out}
@keyframes cd{0%{transform:scale(1.6);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
.go{font-family:var(--font-display);font-weight:800;font-size:clamp(18px,3vh,36px);letter-spacing:.04em;border:0;border-radius:999px;background:var(--accent);color:#fff;
  padding:clamp(14px,2vh,26px) clamp(40px,5vw,80px);cursor:pointer}
.go:hover{filter:brightness(1.08)}
.go:focus-visible,.target:focus-visible,.fs:focus-visible{outline:3px solid var(--signal);outline-offset:3px}

/* Pantalla grande horizontal */
@media (min-aspect-ratio: 5/4){
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(290px,28%) 1fr;grid-template-rows:auto auto auto 1fr;gap:clamp(14px,2.6vh,36px) clamp(24px,3vw,64px)}
  header{grid-column:1;grid-row:1;padding-bottom:clamp(48px,6.5vh,76px)}
  .fs{top:auto;bottom:clamp(10px,1.6vh,18px);right:50%;transform:translateX(50%)}
  .logo{height:clamp(80px,14vh,180px)}
  .bar{grid-column:1;grid-row:2}
  .legend{grid-column:1;grid-row:3;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,16px)}
  .field{grid-column:2;grid-row:1 / 5}
}
@media (prefers-reduced-motion: reduce){.target,.target.hit,.target.gone,.plus,.big.pop{animation-duration:.01s}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <button class="fs" id="fsBtn" type="button">⛶ Pantalla completa</button>
    <img class="logo" id="logo" alt="Clusterciar · Potenciamos tu energía">
    <div class="eyebrow">Juego · Empresas Clusterciar</div>
    <h1>Atrapá <span>el logo</span></h1>
    <p class="lead">Tocá los logos de nuestras empresas antes de que desaparezcan. <b>Llegá a 15 puntos en 20 segundos y ganás.</b></p>
  </header>

  <div class="bar" aria-live="polite">
    <div class="stat" id="scoreBox"><b><span id="score">0</span><i class="goal">/15</i></b><small id="scoreLbl">Puntos</small></div>
    <div class="stat" id="timeBox"><b id="time">0:20</b><small>Tiempo</small></div>
    <div class="stat"><b id="best">0</b><small>Récord</small></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="field" id="field">
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">¿Listo para jugar?</h2>
      <p id="ovText">Cada logo suma <b>1 punto</b> y el de Clusterciar vale <b>3</b>. <b>Llegá a 15 puntos</b> para ganar.</p>
      <div class="big" id="count" hidden></div>
      <button class="go" id="go" type="button">JUGAR</button>
    </div>
  </div>
</div>

const DURATION = 20;               // segundos de juego
const GOAL = 15;                   // puntos para ganar
const COMPANIES = [
  {k:'ciar',label:'Ciar'},{k:'trace',label:'Trace Group'},{k:'rsn',label:'RSN'},{k:'alitaware',label:'Alitâware'}
];
const GOLD = {k:'clusterciar',label:'Clusterciar'};

const $=id=>document.getElementById(id);
const field=$('field'),overlay=$('overlay'),ovTitle=$('ovTitle'),ovText=$('ovText'),countEl=$('count'),goBtn=$('go');
const scoreLbl=$('scoreLbl'),scoreBox=$('scoreBox'),scoreEl=$('score'),timeEl=$('time'),timeBox=$('timeBox'),bestEl=$('best');
$('logo').src=LOGO;
$('legend').innerHTML='<span><img src="'+ISOS.ciar+'" alt=""><img src="'+ISOS.trace+'" alt=""><img src="'+ISOS.rsn+'" alt=""><img src="'+ISOS.alitaware+'" alt=""> <em>+1</em></span>'+
  '<span class="gold"><img src="'+ISOS.clusterciar+'" alt=""> <em>+3</em></span>';

let best=0;try{best=parseInt(localStorage.getItem('atrapa-record')||'0',10)||0}catch(e){}
bestEl.textContent=best;

let score=0,left=DURATION,running=false,clock=null,spawner=null,t0=0,cd=null;
const live=new Set();
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function difficulty(){ // 0 → 1 a lo largo de la partida
  return Math.min(1,(performance.now()-t0)/(DURATION*1000));
}
function size(){
  const r=field.getBoundingClientRect();
  return Math.round(Math.max(70,Math.min(r.width,r.height)*0.2));
}
function freeSpot(d){
  const r=field.getBoundingClientRect(),pad=d*0.6;
  for(let i=0;i<30;i++){
    const x=pad+Math.random()*(r.width-2*pad),y=pad+Math.random()*(r.height-2*pad);
    let ok=true;
    for(const t of live){const dx=t._x-x,dy=t._y-y;if(Math.hypot(dx,dy)<d*1.15){ok=false;break}}
    if(ok)return [x,y];
  }
  return null;
}
function spawn(){
  if(!running)return;
  const f=difficulty();
  const maxLive=f<.35?2:3;
  if(live.size<maxLive){
    const d=size(),spot=freeSpot(d);
    if(spot){
      const gold=Math.random()<0.14;
      const it=gold?GOLD:COMPANIES[Math.floor(Math.random()*COMPANIES.length)];
      const b=document.createElement('button');
      b.type='button';b.className='target'+(gold?' gold':'');b.setAttribute('aria-label',it.label);
      b.style.width=b.style.height=d+'px';b.style.left=spot[0]+'px';b.style.top=spot[1]+'px';
      b._x=spot[0];b._y=spot[1];b._pts=gold?3:1;
      b.innerHTML='<img src="'+ISOS[it.k]+'" alt="">';
      b.addEventListener('pointerdown',e=>{e.preventDefault();hit(b)});
      field.appendChild(b);live.add(b);
      const life=(gold?950:1250)-f*(gold?350:550);
      b._timer=setTimeout(()=>remove(b,'gone'),life);
    }
  }
  const next=650-f*380+Math.random()*180;
  spawner=setTimeout(spawn,next);
}
function remove(b,cls){
  if(!live.has(b))return;
  live.delete(b);clearTimeout(b._timer);b.classList.add(cls);
  setTimeout(()=>b.remove(),260);
}
function hit(b){
  if(!running||!live.has(b))return;
  score+=b._pts;scoreEl.textContent=score;
  if(score>=GOAL&&!scoreBox.classList.contains('met')){scoreBox.classList.add('met');scoreLbl.textContent='¡Meta cumplida!'}
  const p=document.createElement('div');p.className='plus'+(b._pts>1?' gold':'');p.textContent='+'+b._pts;
  p.style.left=b._x+'px';p.style.top=b._y+'px';field.appendChild(p);setTimeout(()=>p.remove(),720);
  remove(b,'hit');
}
function clearField(){for(const t of [...live])remove(t,'gone');field.querySelectorAll('.plus').forEach(p=>p.remove())}

function countdown(){
  clearInterval(cd);clearField();
  score=0;left=DURATION;scoreEl.textContent='0';scoreBox.classList.remove('met');scoreLbl.textContent='Puntos';timeEl.textContent=fmt(DURATION);timeBox.classList.remove('low');
  overlay.classList.remove('won','lost');
  ovTitle.hidden=true;ovText.hidden=true;goBtn.hidden=true;countEl.hidden=false;overlay.hidden=false;
  const steps=['3','2','1','¡Ya!'];let i=0;
  const show=()=>{countEl.textContent=steps[i];countEl.classList.remove('pop');void countEl.offsetWidth;countEl.classList.add('pop')};
  show();
  cd=setInterval(()=>{i++;if(i<steps.length){show();return}clearInterval(cd);start()},800);
}
function start(){
  overlay.hidden=true;running=true;t0=performance.now();
  spawn();
  clock=setInterval(()=>{
    left--;timeEl.textContent=fmt(left);
    if(left<=5)timeBox.classList.add('low');
    if(left<=0)finish();
  },1000);
}
function finish(){
  running=false;clearInterval(clock);clearTimeout(spawner);clearField();
  const record=score>best&&score>0;
  if(record){best=score;bestEl.textContent=best;try{localStorage.setItem('atrapa-record',String(best))}catch(e){}}
  countEl.hidden=true;ovTitle.hidden=false;ovText.hidden=false;goBtn.hidden=false;
  const won=score>=GOAL;
  overlay.classList.toggle('won',won);overlay.classList.toggle('lost',!won);
  ovTitle.classList.remove('rec');
  ovTitle.textContent=won?'¡GANASTE!':'¡Casi!';
  ovText.innerHTML=won
    ? 'Hiciste <b>'+score+' puntos</b> y superaste la meta de '+GOAL+'.'+(record?' <b>¡Y es el nuevo récord del día!</b>':'')
    : 'Hiciste <b>'+score+' puntos</b>. Te '+(GOAL-score===1?'faltó <b>1 punto</b>':'faltaron <b>'+(GOAL-score)+' puntos</b>')+' para la meta de '+GOAL+'. ¡Probá de nuevo!';
  goBtn.textContent='JUGAR DE NUEVO';
  overlay.hidden=false;
}

// Pantalla completa al tocar JUGAR (o el botón)
const fsBtn=$('fsBtn');
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const standalone=matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
const canFs=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
function goFull(){
  if(fsEl()||standalone||!canFs())return;
  const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  try{Promise.resolve(req.call(el,{navigationUI:'hide'})).catch(()=>{})}catch(e){}
}
function syncFs(){fsBtn.hidden=!!fsEl()||standalone||!canFs()}
document.addEventListener('fullscreenchange',syncFs);document.addEventListener('webkitfullscreenchange',syncFs);
fsBtn.onclick=goFull;syncFs();
goBtn.addEventListener('click',()=>{goFull();countdown()});
</script>
